, mash 'em, stick 'em in a stew.",carrot:"Carrots are a great thing to eat when you're hungry and want to stay that way.",eggplant:"Very well, I will marry you if you promise not to make me eat eggplant.",corn:"An efficient way to get energy calories off the land.",popcorn:"Love is sharing your popcorn.",rabbit:"What's up, doc?",cactus:"Adapt to your environment, grow thick skin, and stay sharp.",desert:"A natural extension of the silent mind.",field:"Pray for a good harvest, but keep on plowing.",wheat:"For wheat is wheat, even if people think it is a grass in the beginning.",bread:"Good bread is the most fundamentally satisfying of all foods.","hot dog":"A hot dog is a sandwich, but only if you want to start a heated argument.",croissant:"Croissants in Paris are warm and soft, golden and buttery, like baked clouds.",waffle:"You can't be sad if you're eating a waffle!",pie:"Cut my pie into four pieces, I don't think I could eat eight.",pretzel:"These pretzels are making me thirsty!",rice:"Rice is born in water and dies in wine.","white rice":"At home, a bowl of long-grain white rice will get a stream of melted butter and a crumbling of sea salt.",paella:"A dish that brings people together.",curry:"Without the curry, boiled rice can be very dull.",sake:"The best of all medicines.",park:"Not an island of nature, but a bridge connecting humans back to it.",playground:"The world is a playground, and you know that when you're a kid, but somewhere along the way everyone forgets it.",tree:"He who plants a tree, plants a hope.",palm:"The palm tree that sways in the breeze stays standing the longest.",island:"A prison for some and a refuge for others.",world:"The world is full of magical things, patiently waiting for our senses to grow sharper.",map:"It is not down in any map; true places never are.",compass:"Living without an aim is like sailing without a compass.",fruit:"An apple a day keeps the doctor away.",juice:"The darker the berry, the sweeter the juice.",banana:"Ti
