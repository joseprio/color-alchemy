<!doctype html>
<!-- Music visualizer options as GL SHADERS, running on the GAME's own music.
     Open it in a browser and press play; nothing to build.

     The sibling of experiments/visualizer.html, and deliberately the same page:
     same engine splice, same analysis, same controls, same mock board. What
     changes is where the picture is made — six fragment shaders over a
     fullscreen quad instead of six canvas-2D draw calls — so the two pages can
     be opened side by side and the difference is the technique and nothing
     else.

     THE QUESTION THIS PAGE EXISTS TO ANSWER. The canvas page obeys a rule: the
     visualizer lives on the BORDER and leaves the middle to the game. A shader
     background is the opposite proposal — the whole field, behind everything —
     and the reason to doubt it is that this game is ABOUT COLOUR. Tiles are
     translucent, and a moving coloured field behind them shifts the apparent
     hue of the very swatches the player has to name. So the rule is a SWITCH
     here rather than a law: CLEAR MIDDLE (on by default) fades every option out
     under the board, and turning it off shows what the honest full-field
     version costs. Press G for the mock board and judge it there, not on an
     empty screen — an option that looks best alone is not the one to ship.

     The other two rules from the canvas page still hold:
       - STEREO. The left half of the screen is the left channel, the right half
         the right; the engine's reverb decorrelates them, so this is real
         movement and not a mirror.
       - RAINBOW ACROSS FREQUENCY, low to high, in the title's own gradient —
         red at the bass end, violet at the top.

     1-6 switch, G the mock board, H hides the panel, space plays and pauses.
     INTENSITY is the one slider to reach for first: these are backgrounds, and
     every one of them is more convincing at a level that looks too dim on its
     own. TOP FREQ matters for the same reason it does next door — the music is
     low-passed at 1500-2000 Hz and bands spread past that are dead air.

     If a shader fails to compile the panel says so and prints the driver's log,
     with the line numbered as GL saw it; the page keeps running on the last one
     that worked. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Color Alchemy — GL visualizer</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: #05060f; color: #cfe3ff; font: 13px/1.5 monospace;
    overflow: hidden;
  }
  #viz { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; display: block; }

  /* the mock board, so an option can be judged with the game over it */
  #mock {
    position: fixed; inset: 0; display: none; flex-direction: column;
    align-items: center; pointer-events: none;
  }
  #mock.on { display: flex; }
  #mock h1 {
    margin: 14px 0 0; font-size: 26px; letter-spacing: .18em; font-weight: 700;
    font-family: "Arial Black", Arial, sans-serif;
    background: linear-gradient(90deg, #ff3b30, #ff9430, #ffdc32, #34d158, #33e9e9, #2f6bff, #9a4dff);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  #mock .hud { display: flex; gap: 18px; margin: 10px 0 4px; font-size: 13px; }
  #mock .hud b { color: #fff; }
  #mock .grid { display: grid; grid-template-columns: repeat(4, 92px); gap: 10px; margin-top: 12px; }
  /* the tile background is the GAME's, alpha and all: cc over the shader is
     exactly the see-through this page is here to judge */
  #mock .tile {
    width: 92px; padding: 10px 4px 8px; text-align: center;
    background: #0c1122cc; border: 1px solid #223052; border-radius: 12px;
  }
  #mock .sw { width: 32px; height: 32px; border-radius: 6px; margin: 5px auto; }
  #mock .nm { font-size: 12px; color: #b9d2ee; }
  #mock .foot { margin-top: auto; margin-bottom: 16px; color: #55708e; font-size: 11px; }

  /* controls */
  #ui {
    /* dead centre, because that is the one region every option leaves alone:
       against the right edge it covered the right channel, and the page looked
       mono when it is not */
    position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 340px; max-height: 88vh; overflow: auto; z-index: 5;
    background: #080c18e8; border: 1px solid #223052; border-radius: 12px; padding: 12px 14px;
  }
  #ui h2 { margin: 0 0 8px; font-size: 12px; letter-spacing: .16em; color: #ffd75e; }
  #ui .opt {
    display: flex; gap: 8px; align-items: baseline; padding: 5px 6px; border-radius: 8px;
    cursor: pointer; color: #8fb4d8;
  }
  #ui .opt:hover { background: #101a2e; }
  #ui .opt.on { background: #16233c; color: #fff; }
  #ui .opt kbd {
    background: #101528; border: 1px solid #2a3555; border-radius: 4px;
    padding: 0 5px; color: #7f9fc0; font: inherit; font-size: 11px;
  }
  #ui .note { color: #55708e; font-size: 11px; margin: 2px 0 8px 26px; }
  #ui label { display: flex; align-items: center; gap: 8px; margin: 7px 0; color: #8fb4d8; }
  #ui label span { width: 92px; }
  #ui input[type=range] { flex: 1; accent-color: #33e9e9; }
  #ui .val { width: 34px; text-align: right; color: #7f9fc0; }
  #ui button {
    width: 100%; margin-top: 10px; padding: 9px; background: #101528; color: #ffd75e;
    border: 1px solid #ffd75e; border-radius: 8px; font: inherit; font-size: 13px; cursor: pointer;
  }
  #meter { color: #55708e; font-size: 11px; margin-top: 8px; }
  #meter b { color: #7dff9a; font-weight: 400; }
  /* a shader that will not compile is the one failure this page must not hide */
  #err {
    display: none; margin-top: 8px; padding: 8px; border-radius: 8px;
    background: #1b0d12; border: 1px solid #6b2233; color: #ff9aa8;
    font-size: 11px; white-space: pre-wrap; max-height: 40vh; overflow: auto;
  }
  #err.on { display: block; }
  /* the panel covers the right channel, so it gets out of the way on H */
  #ui.hidden { display: none; }
</style>
</head>
<body>
<canvas id="viz"></canvas>

<div id="mock">
  <h1>COLOR ALCHEMY</h1>
  <div class="hud"><span>Moves: <b>12</b></span><span>Elements: <b>15 / 69</b></span></div>
  <div class="grid">
    <div class="tile"><div class="sw" style="background:#ff3b30"></div><div class="nm">Red</div></div>
    <div class="tile"><div class="sw" style="background:#34d158"></div><div class="nm">Green</div></div>
    <div class="tile"><div class="sw" style="background:#2f6bff"></div><div class="nm">Blue</div></div>
    <div class="tile"><div class="sw" style="background:#ffdc32"></div><div class="nm">Yellow</div></div>
  </div>
  <div class="foot">combine: tap two elements &middot; hint: H &middot; mute: M</div>
</div>

<div id="ui">
  <h2>GL VISUALIZER</h2>
  <div id="opts"></div>
  <label><span>bands</span><input id="bands" type="range" min="8" max="96" value="40"><i class="val" id="bandsV">40</i></label>
  <label><span>sensitivity</span><input id="sens" type="range" min="50" max="400" value="120"><i class="val" id="sensV">1.2</i></label>
  <label><span>smoothing</span><input id="smooth" type="range" min="0" max="95" value="45"><i class="val" id="smoothV">.45</i></label>
  <label><span>intensity</span><input id="gain" type="range" min="20" max="300" value="100"><i class="val" id="gainV">1.0</i></label>
  <label><span>top freq</span><input id="top" type="range" min="1000" max="12000" step="250" value="5000"><i class="val" id="topV">5k</i></label>
  <label><span>auto-level</span><input id="agc" type="checkbox" checked><i class="val"></i></label>
  <label><span>clear middle</span><input id="clear" type="checkbox" checked><i class="val"></i></label>
  <button id="play">PLAY  (space)</button>
  <div class="note" style="margin: 8px 0 0 0">G board &middot; H hide this &middot; space play</div>
  <div id="meter"></div>
  <div id="err"></div>
</div>

<script>
/* === engine: generated from src/music.ts by tools/build-visualizer.mjs === */
/* ------------------------------------------------------------------ the song */
// Rows encoded one character each: a tick count as 'A'+n (< 'N'), then two
// characters per event — patch letter 'a'..'g', then the pitch as chr(110+p).
// Patch letters: a chord, b bass, c pulse, d pulse2, e bass-in, f bass-out,
// g note-off (the bass is the only voice that is ever released early).
const PATS = [
    "Ba[BabBaiBagEafMBaXBa_BadBagBafDabMBaTBa[BadBagEabMBaVBa]BabBagEafM",
    "Ba[BabBaiBagEafMBaXBa_BadBagBafDabMBaTBa[BadBagEabMBaVBa]BabBagEafCKebAgn",
    "Ba[bgBabBaiBagEafMAgnBaXbdBa_BadBagBafDabMAgnBaTb`Ba[BadBagEabMAgnBaVbbBa]BabBagEafMAgn",
    "Ba[bgBabBaiBagBafFcrFcuFcrAgnBaXbdBa_BadBagBafFabcrFcuFcrAgnBaTb`Ba[BadBagBabFcsFcsFcsAgnBaVbbBa]BabBagBafFcrFcpFcrAgn",
    "Ba[bgBabBaiBagBafFcrdwFcudzFcrd|AgnBaXbdBa_BadBagBafFabcrd~Fcud~FcrdzAgnBaTb`Ba[BadBagBabFcsd|Fcsd|FcsdzAgnBaVbbBa]BabBagBafFcrdwFcpduFcrduAgn",
    "Ba[bgBabBaiBagEafMAgnBaXbdBa_BadBagBafDabMAgnBaTb`Ba[BadBagEabMAgnBaVfbBa]BabBagEafM",
];
// which pattern plays when: the four-bar pattern, a variant, then it builds
const ARR = "012233442500";
// One patch per letter:
// [pitch offset, amp A D S R, mod A D S R, carrier, modulator, mod level,
//  LFO frequency multiple, LFO depth, mixer channel, is-the-bass]
// A mod level of 0 means no modulator at all: no second envelope, no LFO — the
// plain-oscillator voice.
const P = [
    [0, 2, 3, 0, 0, 2, 3, 0, 0, 0, 1, 1, 16, 0.03, 1, 0],
    [-24, 0.01, 0, 1, 0.01, 3.333, 3.333, 0, 0, 2, 0, 2, 4, 0.01, 2, 1],
    [0, 0.001, 0.75, 0, 0, 0.001, 0.75, 0, 0, 0, 1, 0.5, 1, 0.03, 4, 0],
    [0, 0.001, 0.75, 0, 0, 0.001, 0.75, 0, 0, 0, 1, 0.5, 1, 0.03, 3, 0],
    [-24, 3.333, 0, 1, 0.01, 0, 0, 0, 0, 2, 0, 0, 0, 0, 2, 1],
    [-24, 0.01, 6.666, 0, 0, 0, 0, 0, 0, 2, 0, 0, 0, 0, 2, 1],
];
const BASEFREQ = 453; // the pitch every note ratio multiplies
const lerp = (a, b, x) => x * b + (1 - x) * a;
/* ------------------------------------------------------------- the generator */
// Builds one sample function for a given sample rate. Everything the engine
// derives — tick length, envelope slopes, delay lengths, filter coefficients —
// is in seconds or Hz, so the song plays at its intended pitch and tempo at
// whatever rate the AudioContext runs at; the file was written for 24 kHz.
function sampler(SR) {
    const TL = (SR * 60) / 90 / 2; // samples per tick: 90 BPM, 2 ticks a beat
    // --- waves. mod is phase modulation in radians, folded into the same call.
    // One function with a switch rather than an array of three closures: the call
    // site in voice() is then monomorphic and inlinable, where indexing into an
    // array of functions is not. The saw's wrap is a compare instead of the two
    // remainders fmod took — its argument is a phase plus a modulator, so it lands
    // in [0.94, 3.06] and one subtraction can never miss.
    const wave = (kind, x, m) => {
        if (kind == 1) {
            let v = 2 * x + 1;
            if (v >= 2)
                v -= 2;
            else if (v < 0)
                v += 2;
            return v - 1;
        }
        if (kind == 2)
            return Math.sin(2 * Math.PI * x + 0.5 * (Math.sin(4 * Math.PI * x + m) + m));
        return Math.sin(2 * Math.PI * x + m);
    };
    // --- envelope: [value, stage, held, active, attack, decay, sustain, release]
    // Stage 0 attack, 1 decay, 2 sustain, 3 release. Zero-length stages need no
    // special case: 1/SR/0 is Infinity, so the ramp reaches its target in one step.
    const env = (e) => {
        if (!e[3])
            return 0;
        const out = e[0], top = e[5] ? 1 : e[6];
        if (!e[2] && e[1] != 3)
            e[1] = 3;
        if (!e[1]) {
            e[0] = Math.min(e[0] + 1 / SR / e[4], top);
            if (e[0] == top)
                e[1] = e[5] ? 1 : 2;
        }
        else if (e[1] == 1) {
            e[0] = Math.max(e[0] - 1 / SR / e[5], e[6]);
            if (e[0] == e[6])
                e[1] = e[6] ? 2 : 3;
        }
        else if (e[1] == 3) {
            e[0] = Math.max(e[0] - 1 / SR / e[7], 0);
            if (!e[0])
                e[3] = 0;
        }
        return out;
    };
    // --- LFO: smoothstep-interpolated random, bipolar. [freq, depth, phase, from, to]
    const lfo = (l) => {
        if (l[2] >= 1) {
            l[2] -= 1;
            l[3] = l[4];
            l[4] = 2 * Math.random() - 1;
        }
        const p = l[2], c = 3 * p * p - 2 * p * p * p;
        l[2] += l[0] / SR;
        return (l[3] * (1 - c) + l[4] * c) * l[1];
    };
    // --- a voice: [ratio, carrier phase, mod phase, amp env, mod env, carrier,
    //               modulator, mod level, LFO, mixer channel, is-the-bass]
    const notes = [];
    const voice = (n) => {
        const step = (BASEFREQ * n[0]) / SR;
        const m = n[7] ? n[7] * wave(n[6], n[2] + lfo(n[8]), 0) * env(n[4]) : 0;
        const out = wave(n[5], n[1], m) * env(n[3]);
        // a phase advances by well under 1 a sample — the highest note steps 0.048 —
        // so wrapping is a compare, not a remainder
        let a = n[1] + step, b = n[2] + step;
        n[1] = a >= 1 ? a - 1 : a;
        n[2] = b >= 1 ? b - 1 : b;
        return out;
    };
    /* ------------------------------------------------------------- effects ---- */
    // Each effect is [kind, ...state]: 0 gain, 1 low-pass, 2 multi-tap delay,
    // 3 diffuser. Kinds 2 and 3 run 8 internal channels.
    const CH = 8;
    const buf = (len) => new Float64Array(Math.max(1, Math.round(len)));
    const gain = (db) => [0, 2 ** (db / 6)];
    // The collapsed filter (see the header): per section, one state that both
    // channels run through, K the pole and G the gain.
    const lpf = (cut, order) => {
        const a = Math.tan((Math.PI * Math.min(cut, 10300)) / SR), a2 = a * a, co = [];
        for (let i = 0; i < order; i++) {
            const r = Math.sin((Math.PI * (2 * i + 1)) / (4 * order)), s = a2 + 2 * a * r + 1;
            co.push((2 * (1 - a2)) / s + (4 * a * r) / s - 1, (4 * a2) / s);
        }
        return [1, co, new Float64Array(order)];
    };
    // Both multi-tap effects keep a write pointer PER buffer (f[9]) rather than one
    // sample counter they take modulo each buffer's length. `idx % len` was running
    // some 48 times a sample across the reverb, and an integer division is dear
    // next to an increment and a compare. The pointers track the counter exactly,
    // so this changes nothing about the sound.
    const HAD = (1 / CH) ** 0.5; // was recomputed 32 times a sample
    // [3, buffers, write index, -, -, -, -, -, -, per-buffer pointers]: 8 taps of
    // random length up to maxdur ms, mixed by a Hadamard matrix. Feeds the reverb
    // its density.
    const diff = (maxdur) => {
        const n = (maxdur / 1e3) * SR, bufs = [];
        for (let c = 0; c < CH; c++)
            bufs.push(buf(Math.floor((n * c) / CH + (n / CH) * Math.random()) + 1));
        return [3, bufs, 0, 0, 0, 0, 0, 0, 0, new Int32Array(CH)];
    };
    // [2, buffers, write index, feedback, mix, mod depth, per-channel angle step,
    //  cos/sin state, one-sample rotation, per-buffer pointers]. The read position
    //  wobbles as Math.cos(k·idx) per channel, which cost 16 Math.cos calls a sample —
    //  23% of the whole engine, measured. It is the same value stepped forward
    //  instead: rotating (cos, sin) by a fixed angle is four multiplies, and
    //  re-anchoring on Math.cos every 1024 samples keeps the drift at the noise
    //  floor rather than letting it accumulate.
    const delay = (time, fdbk, mix, mod, modf) => {
        const bufs = [], k = new Float64Array(CH);
        const cs = new Float64Array(2 * CH), ks = new Float64Array(2 * CH);
        for (let c = 0; c < CH; c++) {
            bufs.push(buf(Math.min((time / 1e3) * SR * 2 ** (c / CH), 1e6)));
            k[c] = (modf * 2 * Math.PI) / SR / 2 ** (c / CH);
            cs[2 * c] = 1; // Math.cos(0), Math.sin(0) at idx 0
            ks[2 * c] = Math.cos(k[c]); // the one-sample rotation
            ks[2 * c + 1] = Math.sin(k[c]);
        }
        return [2, bufs, 0, fdbk, mix, (SR / 960) * mod, k, cs, ks, new Int32Array(CH)];
    };
    // Scratch shared by every effect: S is the signal bus (stereo in [0] and [1],
    // widened in place to 8 taps plus the dry channel when a multi-channel effect
    // needs it), T holds the taps. Both are reused for the life of the sampler —
    // the previous version returned fresh arrays from every stage, which is ~30
    // allocations a sample, and a GC pause inside an audio callback is a click.
    const S = new Float64Array(CH + 1), T = new Float64Array(CH + 1);
    // Runs one effect over S in place and returns the channel count that leaves it.
    const fx = (f, n) => {
        if (!f[0]) {
            S[0] *= f[1];
            S[1] *= f[1];
            return n;
        }
        if (f[0] == 1) {
            const co = f[1], st = f[2];
            for (let i = 0; i < st.length; i++) {
                for (let c = 0; c < 2; c++) {
                    st[i] = co[2 * i] * st[i] + S[c];
                    S[c] = co[2 * i + 1] * st[i];
                }
            }
            return n;
        }
        // both multi-channel effects take either a stereo pair (spread to mono
        // across all 8 taps, dry kept as the 9th) or another effect's 9 values
        const bufs = f[1], idx = f[2];
        const dry0 = S[0], dry1 = S[1];
        if (n == 2) {
            const m = (S[0] + S[1]) / 2;
            for (let i = 0; i <= CH; i++)
                S[i] = m;
        }
        const ptr = f[9];
        if (f[0] == 3) {
            for (let i = 0; i < CH; i++) {
                const b = bufs[i], p = ptr[i];
                T[i] = b[p];
                b[p] = S[i];
                ptr[i] = p + 1 < b.length ? p + 1 : 0;
            }
            f[2]++;
            // Hadamard, then the 1/sqrt(8) that keeps it unitary
            for (let len = 1; len < CH; len *= 2) {
                for (let i = 0; i < CH; i += len * 2) {
                    for (let j = i; j < i + len; j++) {
                        const x = T[j], y = T[j + len];
                        T[j] = x + y;
                        T[j + len] = x - y;
                    }
                }
            }
            const dry = S[CH];
            for (let i = 0; i < CH; i++)
                S[i] = T[i] * HAD;
            S[CH] = dry;
            return CH + 1;
        }
        const k = f[6], cs = f[7], ks = f[8];
        const anchor = (idx & 1023) == 0;
        for (let i = 0; i < CH; i++) {
            if (anchor) {
                cs[2 * i] = Math.cos(k[i] * idx);
                cs[2 * i + 1] = Math.sin(k[i] * idx);
            }
            const b = bufs[i], L = b.length;
            // The read runs AHEAD of the write by the wobble, never by more than the
            // shortest buffer (43 samples against 96 at the shipped settings), so one
            // conditional subtract wraps it — no modulo, and the integer part and the
            // fraction come off the offset rather than off idx + offset, which is also
            // steadier once idx is in the tens of millions.
            // Math.max(0, …) is not cosmetic: the rotation can leave cs a few 1e-16 ABOVE
            // 1, where Math.cos never could, and then the offset goes negative, the
            // read index lands on -1, and a Float64Array returns undefined — silent
            // NaN through the whole mix. It bit at 0.5s in.
            const d = Math.max(0, f[5] * (1 - cs[2 * i])), di = Math.floor(d);
            let p = ptr[i] + di;
            if (p >= L)
                p -= L;
            let q = p + 1;
            if (q >= L)
                q -= L;
            const g = d - di;
            T[i] = b[p] + (b[q] - b[p]) * g;
            // rotate this channel's angle on by one sample, ready for the next call
            const c = cs[2 * i], s = cs[2 * i + 1];
            cs[2 * i] = c * ks[2 * i] - s * ks[2 * i + 1];
            cs[2 * i + 1] = s * ks[2 * i] + c * ks[2 * i + 1];
        }
        // Householder: every tap gets -2/n of the sum
        let sum = 0;
        for (let i = 0; i < CH; i++)
            sum += T[i];
        sum *= -2 / CH;
        for (let i = 0; i < CH; i++)
            T[i] += sum;
        for (let i = 0; i < CH; i++) {
            const b = bufs[i], p = ptr[i];
            b[p] = S[i] + T[i] * f[3];
            ptr[i] = p + 1 < b.length ? p + 1 : 0;
        }
        f[2]++;
        if (n == 2) {
            S[0] = lerp(dry0, T[0], f[4]);
            S[1] = lerp(dry1, T[1], f[4]);
        }
        else {
            const dry = S[CH];
            S[0] = lerp(dry, lerp(T[0], S[0], 0.5), f[4]);
            S[1] = lerp(dry, lerp(T[1], S[1], 0.5), f[4]);
        }
        return 2;
    };
    /* --------------------------------------------------------------- mixer ---- */
    // [destination channel (-1 is the output), effects...]. Channels are processed
    // top down and only ever send downward, so one pass resolves the whole graph.
    const MIX = [
        [-1, gain(-12), diff(20), diff(40), diff(80), diff(160), delay(200, 0.85, 0.75, 0.85, 1.5)],
        [0, lpf(1500, 2)],
        [-1, gain(-15)],
        [0, gain(3), lpf(2000, 2), delay(4, 0, 0.5, 1, 2)],
        [3, gain(3)],
    ];
    // one flat pair per channel, rather than an array of arrays that has to be
    // replaced every sample
    const SIG = new Float64Array(2 * MIX.length);
    const OUT = new Float64Array(2); // what the sampler hands back, reused
    /* ----------------------------------------------------------- sequencer ---- */
    // The encoded patterns, flattened into [ticks, patch, pitch, patch, pitch, ...]
    const ROWS = [];
    for (const a of ARR) {
        const s = PATS[+a];
        for (let i = 0; i < s.length;) {
            const c = s.charCodeAt(i++);
            if (c < 78)
                ROWS.push([c - 65]);
            else
                ROWS[ROWS.length - 1].push(c - 97, s.charCodeAt(i++) - 110);
        }
    }
    let now = 0, next = 0, ptr = 0;
    return () => {
        if (now >= next) {
            const row = ROWS[ptr];
            for (let i = 1; i < row.length; i += 2) {
                const p = P[row[i]], pitch = row[i + 1];
                if (!p) {
                    // note-off: release every envelope of the bass voice
                    for (const n of notes)
                        if (n[10]) {
                            n[3][2] = 0;
                            if (n[4])
                                n[4][2] = 0;
                        }
                }
                else {
                    notes.push([
                        2 ** ((pitch + p[0]) / 12), 0, 0,
                        [0, 0, 1, 1, p[1], p[2], p[3], p[4]],
                        p[11] && [0, 0, 1, 1, p[5], p[6], p[7], p[8]],
                        p[9], p[10], p[11],
                        p[11] && [p[12] * BASEFREQ * 2 ** (pitch / 12), p[13], 1, 0, 0],
                        p[14], p[15],
                    ]);
                }
            }
            next += row[0] * TL;
            ptr = (ptr + 1) % ROWS.length; // the song loops
        }
        now++;
        let sum0 = 0, sum1 = 0;
        for (let i = 0; i < notes.length;) {
            if (!notes[i][3][3]) {
                notes.splice(i, 1);
                continue;
            }
            const out = voice(notes[i]), s = 2 * notes[i][9];
            SIG[s] += out;
            SIG[s + 1] += out;
            i++;
        }
        for (let j = MIX.length; j--;) {
            S[0] = SIG[2 * j];
            S[1] = SIG[2 * j + 1];
            let n = 2;
            for (let k = 1; k < MIX[j].length; k++)
                n = fx(MIX[j][k], n);
            const d = MIX[j][0];
            if (d < 0) {
                sum0 += S[0];
                sum1 += S[1];
            }
            else {
                SIG[2 * d] += S[0];
                SIG[2 * d + 1] += S[1];
            }
            SIG[2 * j] = SIG[2 * j + 1] = 0;
        }
        OUT[0] = sum0;
        OUT[1] = sum1;
        return OUT;
    };
}
/* === end engine === */

/* ------------------------------------------------------------------ audio */
// The game's own playback, in miniature: render quarter-second chunks ahead and
// schedule them, with a splitter feeding one analyser per channel. Identical to
// the canvas page — the two have to be hearing the same thing to be compared.
const SONG_SR = 24000, CHUNK = 0.25, LEAD = 1.5;
let ctx = null, bus = null, anL = null, anR = null, next = null, at = 0, pumping = 0;

function startAudio() {
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  bus = ctx.createGain();
  bus.gain.value = 0.4;
  const split = ctx.createChannelSplitter(2);
  anL = ctx.createAnalyser();
  anR = ctx.createAnalyser();
  anL.fftSize = anR.fftSize = 2048;
  // getByteFrequencyData maps decibels into 0..255 between minDecibels and
  // maxDecibels, and the defaults (-100..-30) put this music's loud bands ABOVE
  // the top of the range, where both channels read 255 and every stereo
  // difference is clipped away. -90..-10 keeps the whole tune inside the scale.
  anL.minDecibels = anR.minDecibels = -90;
  anL.maxDecibels = anR.maxDecibels = -10;
  bus.connect(split);
  split.connect(anL, 0);
  split.connect(anR, 1);
  bus.connect(ctx.destination);
  next = sampler(SONG_SR);
  at = ctx.currentTime + 0.15;
  pump();
  pumping = setInterval(pump, 200);
}

function pump() {
  if (!next) return;
  const N = Math.round(CHUNK * SONG_SR);
  if (at < ctx.currentTime) at = ctx.currentTime + 0.1;
  while (at < ctx.currentTime + LEAD) {
    const b = ctx.createBuffer(2, N, SONG_SR);
    const l = b.getChannelData(0), r = b.getChannelData(1);
    for (let i = 0; i < N; i++) { const s = next(); l[i] = s[0]; r[i] = s[1]; }
    const src = ctx.createBufferSource();
    src.buffer = b;
    src.connect(bus);
    src.start(at);
    at += N / SONG_SR;
  }
}

const playBtn = document.getElementById("play");
let playing = false;
function toggleAudio() {
  if (!ctx) { startAudio(); playing = true; }
  else if (playing) { ctx.suspend(); playing = false; }
  else { ctx.resume(); playing = true; }
  playBtn.textContent = (playing ? "PAUSE" : "PLAY") + "  (space)";
}
playBtn.addEventListener("click", toggleAudio);

/* ----------------------------------------------------------------- analysis */
// Carried over WHOLE from the canvas page, and it should stay that way: it is
// the tuned part. Where the music actually is, measured on the engine at its
// densest, in dB below the peak:
//     20-160 Hz    0      640-1280 Hz  -18      2560-5120 Hz  -54
//     160-320     -8     1280-2560     -39      5120-10240    -76
//     320-640    -12                            10240+        -99
// The mixer low-passes the pad at 1500 Hz and the pulse bus at 2000, so there is
// nothing in the top half of the spectrum by construction. Bands run 40 Hz to
// `top` rather than across the analyser's full 0-24 kHz.
const MAXB = 96;
const opt = { bands: 40, sens: 1.2, smooth: 0.45, gain: 1, top: 5000, agc: 1, clear: 1 };
let freqL, freqR;
const peakL = new Float32Array(MAXB).fill(0.2), peakR = new Float32Array(MAXB).fill(0.2);

// One log-spaced band per slot between 40 Hz and opt.top, each taking the
// loudest bin it covers — an average washes the detail out. Then auto-level,
// per band: the bass here is a sustained pad under a sustained bass line, so on
// any fixed scale it sits pinned at the ceiling and stops moving while the highs
// never leave the floor. Dividing each band by its own slowly-decaying peak
// gives every band its full range and shows its own variation rather than the
// mix's balance. Turn it off to see the raw balance.
function bands(data, n, out, peak) {
  const binHz = (ctx ? ctx.sampleRate : 48000) / (anL ? anL.fftSize : 2048);
  const lo0 = Math.max(1, Math.round(40 / binHz));
  const hi0 = Math.max(lo0 + n, Math.min(data.length, Math.round(opt.top / binHz)));
  const ratio = hi0 / lo0;
  for (let i = 0; i < n; i++) {
    const lo = Math.round(lo0 * ratio ** (i / n));
    const hi = Math.max(lo + 1, Math.round(lo0 * ratio ** ((i + 1) / n)));
    let m = 0;
    for (let j = lo; j < hi && j < data.length; j++) if (data[j] > m) m = data[j];
    let v = (m / 255) * opt.sens;
    if (opt.agc) {
      peak[i] = Math.max(v, peak[i] * 0.9995 + 0.00005);     // jump up, drift down
      v /= Math.max(peak[i], 0.08);                          // floor: silence stays silent
    }
    // tanh, not min(1, …): a hard clip pins loud bands to exactly 1 on BOTH
    // channels, which erases the stereo difference where the music is loudest.
    v = Math.tanh(v * 1.1);
    out[i] = out[i] * opt.smooth + v * (1 - opt.smooth);     // on top of the analyser's own
  }
  return out;
}
// mean band level, as a 0-100 reading per channel
const lvl = (a, n) => {
  let s = 0;
  for (let i = 0; i < n; i++) s += a[i];
  return Math.round((s / n) * 100);
};

// A shader wants a handful of NUMBERS as well as the spectrum: three coarse
// energies and a beat. The split points are the music's own — the bass line and
// pad live under about 300 Hz, the chord body up to 1200, and everything above
// that is the pulse voice and the delay's brightness. They are read off the
// band array rather than the FFT again, so they inherit the auto-level.
const energy = new Float32Array(3);
function energies(L, R, n) {
  const cut = (frac) => Math.max(1, Math.round(n * frac));
  const b = cut(0.16), m = cut(0.52);
  let s0 = 0, s1 = 0, s2 = 0;
  for (let i = 0; i < n; i++) {
    const v = (L[i] + R[i]) * 0.5;
    if (i < b) s0 += v; else if (i < m) s1 += v; else s2 += v;
  }
  energy[0] = s0 / b;
  energy[1] = s1 / Math.max(1, m - b);
  energy[2] = s2 / Math.max(1, n - m);
}
// A beat is a RISE in the bass, not a level: the pad never lets the bass fall to
// zero, so anything thresholded on the value alone is either always on or always
// off. Track a slow average and spike on the distance above it, then decay.
let bassAvg = 0, beat = 0;
function beatOf(dt) {
  const b = energy[0];
  bassAvg = bassAvg * 0.98 + b * 0.02;
  beat = Math.max(beat - dt * 2.4, Math.min(1, Math.max(0, (b - bassAvg) * 4)));
  return beat;
}

/* ---------------------------------------------------------------------- GL */
const cv = document.getElementById("viz");
const gl = cv.getContext("webgl2", { alpha: false, antialias: false, depth: false });
const errEl = document.getElementById("err");
function fail(msg) {
  errEl.textContent = msg;
  errEl.classList.add("on");
}

// One vertex shader for every option: a fullscreen TRIANGLE, not a quad. Three
// vertices with no buffer at all — gl_VertexID indexes a constant array — so
// there is no attribute state to set up and no diagonal seam where two triangles
// would meet.
const VERT = `#version 300 es
void main() {
  vec2 p = vec2((gl_VertexID << 1) & 2, gl_VertexID & 2);
  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);
}`;

// Prepended to every option below, so each one is only its own idea. Everything
// an option is allowed to know about the music arrives through these uniforms.
const PRELUDE = `#version 300 es
precision highp float;

uniform vec2  uRes;      // canvas size, device pixels
uniform float uTime;     // seconds since the page loaded
uniform float uBeat;     // 0..1, a decaying spike on each bass onset
uniform float uGain;     // the INTENSITY slider
uniform float uClear;    // 1 when CLEAR MIDDLE is on
uniform float uN;        // how many bands are live in uBands
uniform vec3  uEnergy;   // bass / mid / treble, 0..1, auto-levelled
uniform vec2  uLevel;    // mean band level, left and right
uniform sampler2D uBands;// the spectrum: row 0 left, row 1 right

out vec4 fragColor;

const float PI = 3.14159265;
// The page's own #05060f. Every option ADDS to it rather than replacing it, so
// silence looks like the game's background and not like a black screen.
const vec3 GROUND = vec3(0.0196, 0.0235, 0.0588);

// x: 0 at 40 Hz, 1 at the TOP FREQ slider. ch: 0 left, 1 right.
// The texture is always MAXB wide and only the first uN columns are live, so the
// lookup walks texel CENTRES from the first band to the last — sampling the full
// width would drag the dead tail in and flatten the treble end.
float band(float x, float ch) {
  float u = (0.5 + clamp(x, 0.0, 1.0) * (uN - 1.0)) / ${MAXB}.0;
  return texture(uBands, vec2(u, ch * 0.5 + 0.25)).r;
}
vec2 bandLR(float x) { return vec2(band(x, 0.0), band(x, 1.0)); }

// The title's own gradient, and the same direction the canvas page uses:
// red at the bass end, violet at the top.
vec3 rainbow(float t) {
  t = clamp(t, 0.0, 1.0) * 6.0;
  vec3 c0 = vec3(1.000, 0.231, 0.188),  // #ff3b30
       c1 = vec3(1.000, 0.580, 0.188),  // #ff9430
       c2 = vec3(1.000, 0.863, 0.196),  // #ffdc32
       c3 = vec3(0.204, 0.820, 0.345),  // #34d158
       c4 = vec3(0.200, 0.914, 0.914),  // #33e9e9
       c5 = vec3(0.184, 0.420, 1.000),  // #2f6bff
       c6 = vec3(0.604, 0.302, 1.000);  // #9a4dff
  vec3 a = t < 1.0 ? c0 : t < 2.0 ? c1 : t < 3.0 ? c2 : t < 4.0 ? c3 : t < 5.0 ? c4 : c5;
  vec3 b = t < 1.0 ? c1 : t < 2.0 ? c2 : t < 3.0 ? c3 : t < 4.0 ? c4 : t < 5.0 ? c5 : c6;
  return mix(a, b, fract(t));
}

// Screen position, centred at 0 and scaled by HEIGHT on both axes, so a circle
// is a circle and the picture does not stretch on a wide window.
vec2 uvC() { return (gl_FragCoord.xy - 0.5 * uRes) / uRes.y; }

float hash11(float n) { return fract(sin(n * 127.1) * 43758.5453123); }
float hash21(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453123); }
float noise(vec2 p) {
  vec2 i = floor(p), f = fract(p);
  vec2 u = f * f * (3.0 - 2.0 * f);
  return mix(mix(hash21(i), hash21(i + vec2(1, 0)), u.x),
             mix(hash21(i + vec2(0, 1)), hash21(i + vec2(1, 1)), u.x), u.y);
}
float fbm(vec2 p) {
  float v = 0.0, a = 0.5;
  for (int i = 0; i < 5; i++) { v += a * noise(p); p *= 2.02; a *= 0.5; }
  return v;
}

// THE BOARD SITS IN THE MIDDLE. With CLEAR MIDDLE on, every option is faded out
// across the region the tiles occupy — an ellipse a little wider than tall,
// because the board is — so the colour under a swatch is the game's own.
float away(vec2 pc) {
  return smoothstep(0.16, 0.66, length(pc * vec2(0.78, 1.0)));
}

// Every option ends here: the middle mask, the intensity slider, the ground.
void finish(vec3 col) {
  col *= mix(1.0, away(uvC()), uClear);
  fragColor = vec4(GROUND + col * uGain, 1.0);
}
`;

/* ------------------------------------------------------------------ options */
// Each option is a fragment shader with a main(), appended to the PRELUDE.
// The note is what the option is FOR, not what it does — the code says that.
const SHADERS = [
  {
    name: "rim bloom",
    note: "The GL answer to the canvas page's edge bars: the same band-per-slot layout down each side, but as light rather than rectangles. Soft falloff into the screen is what a shader buys you here — the 2D version would need a blur pass per frame to look like this.",
    src: `
void main() {
  vec2 p = gl_FragCoord.xy / uRes;
  // the left half of the screen is the left channel
  float ch = p.x < 0.5 ? 0.0 : 1.0;
  // CENTRED, like the canvas page's default: bass at the middle of each edge,
  // treble running out to both corners
  float tv = abs(p.y - 0.5) * 2.0;
  float th = abs(p.x - 0.5) * 2.0;
  float av = band(tv, ch), ah = band(th, ch);
  // distance to the nearest edge, and a falloff that REACHES FURTHER as the
  // band gets louder rather than just getting brighter in place
  float dv = min(p.x, 1.0 - p.x);
  float dh = min(p.y, 1.0 - p.y);
  vec3 col = rainbow(tv) * av * exp(-dv * 22.0 / (0.35 + av))
           + rainbow(th) * ah * exp(-dh * 22.0 / (0.35 + ah)) * 0.7;
  // a whole-rim lift on the beat, so the frame breathes with the bass
  col *= 1.0 + uBeat * 0.6;

  {
    name: "aurora curtains",

// A curtain's height is its band; the shimmer along it is noise scrolling
// upward, which is what keeps a tall curtain from reading as a flat bar.
float curtain(vec2 p, float a, float dir) {

  float top = 0.04 + a * 0.46 + wob * a;

  // edge1, however reliably every driver happens to implement it
  float v = 1.0 - smoothstep(0.0, top, y);
  float shimmer = 0.55 + 0.45 * fbm(vec2(p.x * 9.0, y * 4.0 - uTime * 0.7));

void main() {
  vec2 p = gl_FragCoord.xy / uRes;

/* ------------------------------------------------------------- GL plumbing */
// Programs are compiled on FIRST USE and kept: switching options should not
// stall, and a page with six shaders in it should not pay for six compiles
// before the first frame.
const programs = new Array(SHADERS.length).fill(null);
const locs = new Array(SHADERS.length).fill(null);
let vao = null, tex = null, mode = 0, compiledMs = 0;

function compile(kind, src) {
  const sh = gl.createShader(kind);
  gl.shaderSource(sh, src);
  gl.compileShader(sh);
  if (!gl.getShaderParameter(sh, gl.COMPILE_STATUS)) {
    const log = gl.getShaderInfoLog(sh);
    gl.deleteShader(sh);
    // GL numbers the whole source, prelude included, so print it that way or the
    // line in the message means nothing
    const lines = src.split("\n").map((l, i) => String(i + 1).padStart(4) + " | " + l);
    throw new Error(log + "\n" + lines.join("\n"));
  }
  return sh;
}

const UNIFORMS = ["uRes", "uTime", "uBeat", "uGain", "uClear", "uN", "uEnergy", "uLevel", "uBands"];

function program(i) {
  if (programs[i]) return programs[i];
  const t0 = performance.now();
  const vs = compile(gl.VERTEX_SHADER, VERT);
  const fs = compile(gl.FRAGMENT_SHADER, PRELUDE + SHADERS[i].src);
  const p = gl.createProgram();
  gl.attachShader(p, vs);
  gl.attachShader(p, fs);
  gl.linkProgram(p);
  gl.deleteShader(vs);
  gl.deleteShader(fs);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  compiledMs = performance.now() - t0;
  programs[i] = p;
  locs[i] = {};
  for (const u of UNIFORMS) locs[i][u] = gl.getUniformLocation(p, u);
  return p;
}

// The spectrum as a texture: MAXB wide, two rows. R8 rather than a float
// texture because the analyser already hands us bytes, and LINEAR so a shader
// can read BETWEEN bands and get a smooth curve instead of a staircase.
const texData = new Uint8Array(MAXB * 2);
function initGL() {
  vao = gl.createVertexArray();          // no attributes, but core profile wants one bound
  gl.bindVertexArray(vao);
  tex = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, tex);
  gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.R8, MAXB, 2, 0, gl.RED, gl.UNSIGNED_BYTE, texData);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
}

let dpr = 1;
function resize() {
  dpr = Math.min(devicePixelRatio || 1, 2);
  cv.width = Math.round(innerWidth * dpr);
  cv.height = Math.round(innerHeight * dpr);
  cv.style.width = innerWidth + "px";
  cv.style.height = innerHeight + "px";
  if (gl) gl.viewport(0, 0, cv.width, cv.height);
}
addEventListener("resize", resize);

/* ------------------------------------------------------------------- draw */
let bl = new Float32Array(MAXB), br = new Float32Array(MAXB);
let frames = 0, fpsAt = 0, stereo = 0, last = 0, fps = 0;

function frame(now) {
  const dt = Math.min(0.1, (now - last) / 1000) || 0;
  last = now;
  const n = opt.bands;

  if (anL) {
    anL.smoothingTimeConstant = anR.smoothingTimeConstant = 0.3;
    anL.getByteFrequencyData(freqL);
    anR.getByteFrequencyData(freqR);
    const L = bands(freqL, n, bl, peakL), R = bands(freqR, n, br, peakR);
    energies(L, R, n);
    beatOf(dt);
    // how far apart the two sides actually are, in the bands being drawn — the
    // reverb decorrelates the channels, and this says by how much
    let d = 0, c = 0;
    for (let i = 0; i < n; i++) {
      if (L[i] > 0.02 || R[i] > 0.02) { d += Math.abs(20 * Math.log10((L[i] + 1e-4) / (R[i] + 1e-4))); c++; }
    }
    stereo = stereo * 0.9 + (c ? d / c : 0) * 0.1;
    for (let i = 0; i < n; i++) {
      texData[i] = Math.max(0, Math.min(255, L[i] * 255)) | 0;
      texData[MAXB + i] = Math.max(0, Math.min(255, R[i] * 255)) | 0;
    }
  }

  if (gl) {
    let p;
    try {
      p = program(mode);
      errEl.classList.remove("on");
    } catch (e) {
      fail("shader " + (mode + 1) + " (" + SHADERS[mode].name + ") failed:\n\n" + e.message);
      // fall back to whatever last compiled, so the page keeps running
      p = programs.find(Boolean);
      if (!p) return requestAnimationFrame(frame);
    }
    const u = locs[programs.indexOf(p)];
    gl.useProgram(p);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, MAXB, 2, gl.RED, gl.UNSIGNED_BYTE, texData);
    gl.uniform2f(u.uRes, cv.width, cv.height);
    gl.uniform1f(u.uTime, now / 1000);
    gl.uniform1f(u.uBeat, beat);
    gl.uniform1f(u.uGain, opt.gain);
    gl.uniform1f(u.uClear, opt.clear);
    gl.uniform1f(u.uN, n);
    gl.uniform3f(u.uEnergy, energy[0], energy[1], energy[2]);
    gl.uniform2f(u.uLevel, lvl(bl, n) / 100, lvl(br, n) / 100);
    gl.uniform1i(u.uBands, 0);
    gl.bindVertexArray(vao);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  frames++;
  if (now - fpsAt > 500) {
    fps = Math.round((frames * 1000) / (now - fpsAt));
    document.getElementById("meter").innerHTML =
      fps + " fps &middot; " + SHADERS[mode].name +
      " &middot; L/R differ by <b>" + stereo.toFixed(1) + " dB</b> across bands" +
      "<br>level L <b>" + lvl(bl, n) + "</b> R <b>" + lvl(br, n) + "</b>" +
      " &middot; bass <b>" + energy[0].toFixed(2) + "</b> mid <b>" + energy[1].toFixed(2) +
      "</b> treble <b>" + energy[2].toFixed(2) + "</b> beat <b>" + beat.toFixed(2) + "</b>" +
      "<br>" + cv.width + "x" + cv.height + " &middot; compile <b>" + compiledMs.toFixed(1) +
      " ms</b> &middot; " + renderer;
    frames = 0;
    fpsAt = now;
  }
  requestAnimationFrame(frame);
}

/* ---------------------------------------------------------------- controls */
const optsEl = document.getElementById("opts");
SHADERS.forEach((m, i) => {
  const d = document.createElement("div");
  d.innerHTML = `<div class="opt" data-i="${i}"><kbd>${i + 1}</kbd> ${m.name}</div>` +
    `<div class="note">${m.note}</div>`;
  optsEl.appendChild(d);
});
function pick(i) {
  mode = (i + SHADERS.length) % SHADERS.length;
  [...document.querySelectorAll(".opt")].forEach((el, j) => el.classList.toggle("on", j === mode));
}
optsEl.addEventListener("click", (e) => {
  const el = e.target.closest(".opt");
  if (el) pick(+el.dataset.i);
});
pick(0);

const slider = (id, key, fmt, scale) => {
  const el = document.getElementById(id), out = document.getElementById(id + "V");
  const apply = () => {
    opt[key] = +el.value * scale;
    out.textContent = fmt(opt[key]);
    if (key === "bands" || key === "top") { bl.fill(0); br.fill(0); peakL.fill(0.2); peakR.fill(0.2); }
  };
  el.addEventListener("input", apply);
  apply();
};
slider("bands", "bands", (v) => v, 1);
slider("sens", "sens", (v) => v.toFixed(1), 0.01);
slider("smooth", "smooth", (v) => v.toFixed(2).slice(1), 0.01);
slider("gain", "gain", (v) => v.toFixed(1), 0.01);
slider("top", "top", (v) => (v >= 1000 ? (v / 1000).toFixed(1).replace(".0", "") + "k" : v), 1);

// auto-level answers "the bands do not move"; clear middle is the whole
// argument of this page, so neither is a buried constant
const toggle = (id, key) => {
  const el = document.getElementById(id);
  const apply = () => {
    opt[key] = el.checked ? 1 : 0;
    peakL.fill(0.2);
    peakR.fill(0.2);
  };
  el.addEventListener("change", apply);
  apply();
};
toggle("agc", "agc");
toggle("clear", "clear");

addEventListener("keydown", (e) => {
  if (e.key >= "1" && e.key <= String(SHADERS.length)) pick(+e.key - 1);
  else if (e.key === "g" || e.key === "G") document.getElementById("mock").classList.toggle("on");
  else if (e.key === "h" || e.key === "H") document.getElementById("ui").classList.toggle("hidden");
  else if (e.key === " ") { toggleAudio(); e.preventDefault(); }
});

// the analyser buffers, sized for the fftSize above
freqL = new Uint8Array(1024);
freqR = new Uint8Array(1024);

/* -------------------------------------------------------------------- boot */
let renderer = "no GL";
if (!gl) {
  fail("WebGL2 is not available in this browser, so there is nothing to show. " +
       "The canvas options next door (experiments/visualizer.html) do not need it.");
} else {
  const dbg = gl.getExtension("WEBGL_debug_renderer_info");
  renderer = dbg ? gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) : "GL";
  // a software rasteriser will run every one of these and lie about the cost,
  // which is the one thing this page must not do quietly
  if (/swiftshader|llvmpipe|software/i.test(renderer)) {
    renderer = renderer + " — SOFTWARE, fps here means nothing";
  }
  initGL();
  resize();
  requestAnimationFrame(frame);
}
</script>
</body>
</html>
